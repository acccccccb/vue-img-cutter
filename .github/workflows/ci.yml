name: CI

on:
  push:
    branches: [ master, main, develop/v3 ]
  pull_request:
    branches: [ master, main, develop/v3 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build:page
